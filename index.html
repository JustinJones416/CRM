<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexo CRM — Prototipo Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --ink:#12182B;
  --ink2:#1B2340;
  --paper:#F5F6F9;
  --card:#FFFFFF;
  --line:#E4E6EE;
  --text:#1B2340;
  --muted:#6B7080;
  --accent:#0F8B7F;
  --accent-soft:#E4F5F2;
  --info:#4C5FD5;
  --info-soft:#EBEDFB;
  --amber:#B9791A;
  --amber-soft:#FCF1DD;
  --red:#C6432A;
  --red-soft:#FBE8E3;
  --radius:10px;
  --shadow:0 1px 2px rgba(18,24,43,.04), 0 4px 16px rgba(18,24,43,.05);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--text);font-size:14px;}
h1,h2,h3,.display{font-family:'Sora',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}

/* ---------- SHELL ---------- */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
.sidebar{background:var(--ink);color:#C6CBE0;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 20px;}
.brand .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#0B6259);display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:800;color:#fff;font-size:14px;}
.brand .name{font-family:'Sora';font-weight:700;color:#fff;font-size:15px;}
.brand .sub{font-size:10px;color:#8388A3;letter-spacing:.04em;}
.navgroup{margin-bottom:4px;}
.navgroup-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#666C87;padding:14px 12px 6px;}
.navitem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:8px;font-size:13.2px;color:#C6CBE0;text-decoration:none;margin-bottom:1px;}
.navitem:hover{background:#1F2745;color:#fff;}
.navitem.active{background:var(--accent);color:#fff;font-weight:600;}
.navitem .tag{font-size:9.5px;background:#2A3358;color:#9AA1C4;padding:2px 6px;border-radius:20px;letter-spacing:.02em;}
.navitem.active .tag{background:rgba(255,255,255,.2);color:#fff;}

.main{min-width:0;}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20;}
.topbar h1{font-size:16px;margin:0;font-weight:700;}
.topbar .right{display:flex;align-items:center;gap:14px;}
.pill{font-size:11.5px;background:var(--info-soft);color:var(--info);padding:5px 10px;border-radius:20px;font-weight:600;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--info);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;font-family:'Sora';}
.menu-btn{display:none;background:none;border:none;color:var(--text);font-size:20px;}

.content{padding:22px;max-width:1400px;}
.view{display:none;}
.view.active{display:block;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- COMMON ---------- */
.grid{display:grid;gap:14px;}
.cols-4{grid-template-columns:repeat(4,1fr);}
.cols-3{grid-template-columns:repeat(3,1fr);}
.cols-2{grid-template-columns:repeat(2,1fr);}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:16px 18px;}
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:26px 0 10px;}
.section-title:first-child{margin-top:0;}

.kpi{padding:15px 16px;}
.kpi .label{font-size:12px;color:var(--muted);font-weight:500;}
.kpi .value{font-family:'Sora';font-size:26px;font-weight:700;margin:4px 0 6px;}
.kpi .insight{font-size:12px;padding:5px 8px;border-radius:6px;display:inline-block;font-weight:600;}
.kpi .insight.warn{background:var(--amber-soft);color:var(--amber);}
.kpi .insight.risk{background:var(--red-soft);color:var(--red);}
.kpi .insight.good{background:var(--accent-soft);color:var(--accent);}
.kpi .insight.info{background:var(--info-soft);color:var(--info);}
.kpi.clickable{cursor:pointer;transition:.15s;}
.kpi.clickable:hover{border-color:var(--accent);transform:translateY(-1px);}
.clickable{cursor:pointer;transition:.15s;}
.alert-row.clickable:hover{background:var(--paper);border-radius:8px;}

.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:#c7cade;}
.btn-primary{background:var(--ink2);color:#fff;border-color:var(--ink2);}
.btn-primary:hover{background:#0E1530;}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-ghost{background:none;border:none;color:var(--info);font-weight:600;}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.toolbar .filters{display:flex;gap:8px;flex-wrap:wrap;}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--text);
}
textarea{width:100%;resize:vertical;}
.search-box{position:relative;}
.search-box input{padding-left:30px;width:220px;}
.search-box::before{content:"⌕";position:absolute;left:10px;top:7px;color:var(--muted);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.rowlink:hover{background:#FAFBFD;cursor:pointer;}
.table-wrap{overflow-x:auto;}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.badge-nuevo{background:var(--info-soft);color:var(--info);}
.badge-contactado{background:#EFEFF7;color:#5B5FA8;}
.badge-calificado{background:var(--accent-soft);color:var(--accent);}
.badge-nocalificado{background:#F1F1F4;color:var(--muted);}
.badge-seguimiento{background:var(--amber-soft);color:var(--amber);}
.badge-convertido{background:#E1F5EA;color:#1E8449;}
.badge-perdido{background:var(--red-soft);color:var(--red);}
.badge-descartado{background:#F1F1F4;color:#8388A3;text-decoration:line-through;}
.badge-baja{background:#F1F1F4;color:var(--muted);}
.badge-media{background:var(--info-soft);color:var(--info);}
.badge-alta{background:var(--amber-soft);color:var(--amber);}
.badge-critica{background:var(--red-soft);color:var(--red);}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;}

.score-chip{font-family:'IBM Plex Mono';font-weight:600;font-size:12px;padding:2px 8px;border-radius:6px;}
.score-frio{background:var(--info-soft);color:var(--info);}
.score-tibio{background:var(--amber-soft);color:var(--amber);}
.score-caliente{background:#FDE7DE;color:#C1531F;}
.score-prioridad{background:var(--red-soft);color:var(--red);}

.empty{padding:40px 20px;text-align:center;color:var(--muted);}
.empty .big{font-size:28px;margin-bottom:8px;}
.soon-badge{font-size:9.5px;background:#2A3358;color:#9AA1C4;padding:2px 6px;border-radius:20px;}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(18,24,43,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-bg.active{display:flex;}
.modal{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-size:16px;}
.modal-body{padding:18px 20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.close-x{background:none;border:none;font-size:18px;color:var(--muted);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid .full{grid-column:1/-1;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;}

/* toast */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40;display:none;}
.overlay.active{display:block;}
.toast{background:var(--ink2);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;animation:slidein .2s ease;min-width:220px;}
.toast.err{background:var(--red);}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;}
.kcol{min-width:250px;background:#EEF0F5;border-radius:10px;padding:10px;flex:0 0 250px;}
.kcol-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 10px;}
.kcol-head .t{font-weight:700;font-size:13px;}
.kcol-head .n{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono';}
.kcol-sum{font-size:11px;color:var(--muted);padding:0 4px 8px;font-family:'IBM Plex Mono';}
.kcard{background:#fff;border-radius:8px;padding:10px 11px;margin-bottom:8px;box-shadow:0 1px 2px rgba(18,24,43,.06);border:1px solid var(--line);cursor:grab;}
.kcard:active{cursor:grabbing;}
.kcard.drag{opacity:.4;}
.kcard .name{font-weight:600;font-size:13px;margin-bottom:3px;}
.kcard .company{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
.kcard .foot{display:flex;justify-content:space-between;align-items:center;}
.kcard .value{font-family:'IBM Plex Mono';font-weight:600;font-size:12.5px;}
.kcard .days{font-size:10.5px;color:var(--muted);}
.kcard .days.stale{color:var(--red);font-weight:600;}
.kcol.dragover{outline:2px dashed var(--accent);outline-offset:-4px;}

/* timeline */
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:18px;}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item::before{content:"";position:absolute;left:-23px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--accent);}
.tl-date{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono';}
.tl-title{font-weight:600;font-size:13.5px;}

/* alert list */
.alert-row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);}
.alert-row:last-child{border-bottom:none;}
.alert-row .txt{font-size:13px;}
.alert-row .txt b{font-weight:700;}

@media(max-width:900px){
  .shell{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:-260px;top:0;width:236px;z-index:50;transition:.2s;box-shadow:8px 0 30px rgba(0,0,0,.2);}
  .sidebar.open{left:0;}
  .menu-btn{display:block;}
  .cols-4,.cols-3,.cols-2{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .content{padding:14px;}
  table thead{display:none;}
  table,tbody,tr,td{display:block;width:100%;}
  tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:6px 0;background:#fff;}
  td{border:none;padding:6px 14px;display:flex;justify-content:space-between;gap:10px;}
  td::before{content:attr(data-label);font-size:11px;color:var(--muted);font-weight:600;}
}
</style>
</head>
<body>

<div class="shell">
  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">N</div>
      <div><div class="name">Nexo CRM</div><div class="sub">MODO PROTOTIPO · DATOS LOCALES</div></div>
    </div>
    <nav id="navroot"></nav>
  </aside>
  <div class="overlay" id="overlay"></div>

  <!-- ================= MAIN ================= -->
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="menu-btn" id="menuBtn">☰</button>
        <h1 id="viewTitle">Dashboard</h1>
      </div>
      <div class="right">
        <span class="pill">Rol: Gerente Comercial</span>
        <div class="avatar">JR</div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBox"></div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================================================================
   NEXO CRM — PROTOTIPO FUNCIONAL DE FRONTEND
   ----------------------------------------------------------------------------
   Persistencia: localStorage (clave "nexocrm_v1"), EXCLUSIVAMENTE como modo
   demo mientras no exista un backend Supabase conectado. En producción esta
   capa se reemplaza por services/ contra Supabase (ver docs/arquitectura.md).
   Estructura interna organizada por "módulos" (aunque en un solo archivo) para
   reflejar la arquitectura real: DATA / RULES / RENDER / EVENTS.
============================================================================ */

/* ---------------------------- DATA LAYER ---------------------------- */
const STORAGE_KEY = "nexocrm_v1";

function uid(){ return Math.random().toString(36).slice(2,10); }
function todayISO(){ return new Date().toISOString(); }
function daysAgo(iso){ return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
/* Una tarea está vencida si sigue pendiente y su fecha ya pasó — se calcula siempre en vivo,
   nunca se guarda como estado fijo, así el dashboard refleja la realidad sin desactualizarse. */
function tareaVencida(a){ return a.estado==="pendiente" && new Date(a.fecha).getTime() < Date.now(); }
function fmtMoney(n){ return "$"+Number(n||0).toLocaleString("es-PA",{minimumFractionDigits:0,maximumFractionDigits:0}); }
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); return d.toLocaleDateString("es-PA",{day:"2-digit",month:"short"}); }

const FUENTES = ["Referido","Google Ads","Meta Ads","Sitio web","Feria comercial","Llamada en frío"];

/* ---------------------------- PAÍSES / HUSOS HORARIOS ---------------------------- */
/* Catálogo usado para el mapa mundial y el cálculo de hora local del cliente.
   tz = zona horaria IANA (para Intl.DateTimeFormat), lat/lng = coordenadas aproximadas de capital/centro. */
const PAISES_TZ = [
  {pais:"España", flag:"🇪🇸", tz:"Europe/Madrid", lat:40.4168, lng:-3.7038},
  {pais:"Panamá", flag:"🇵🇦", tz:"America/Panama", lat:8.9824, lng:-79.5199},
  {pais:"México", flag:"🇲🇽", tz:"America/Mexico_City", lat:19.4326, lng:-99.1332},
  {pais:"Colombia", flag:"🇨🇴", tz:"America/Bogota", lat:4.7110, lng:-74.0721},
  {pais:"Argentina", flag:"🇦🇷", tz:"America/Argentina/Buenos_Aires", lat:-34.6037, lng:-58.3816},
  {pais:"Chile", flag:"🇨🇱", tz:"America/Santiago", lat:-33.4489, lng:-70.6693},
  {pais:"Perú", flag:"🇵🇪", tz:"America/Lima", lat:-12.0464, lng:-77.0428},
  {pais:"Estados Unidos", flag:"🇺🇸", tz:"America/New_York", lat:38.9072, lng:-77.0369},
  {pais:"República Dominicana", flag:"🇩🇴", tz:"America/Santo_Domingo", lat:18.4861, lng:-69.9312},
  {pais:"Costa Rica", flag:"🇨🇷", tz:"America/Costa_Rica", lat:9.9281, lng:-84.0907},
  {pais:"Ecuador", flag:"🇪🇨", tz:"America/Guayaquil", lat:-0.1807, lng:-78.4678},
  {pais:"Uruguay", flag:"🇺🇾", tz:"America/Montevideo", lat:-34.9011, lng:-56.1645},
];
function paisInfo(nombre){ return PAISES_TZ.find(p=>p.pais===nombre) || null; }
function horaLocal(nombrePais){
  const p = paisInfo(nombrePais);
  if(!p) return "—";
  try{
    return new Intl.DateTimeFormat("es",{hour:"2-digit",minute:"2-digit",timeZone:p.tz}).format(new Date());
  }catch(e){ return "—"; }
}
function diferenciaHoras(nombrePais){
  const p = paisInfo(nombrePais);
  if(!p) return null;
  try{
    const fmt = (tz)=> new Date(new Date().toLocaleString("en-US",{timeZone:tz}));
    const localCliente = fmt(p.tz);
    const localNuestro = fmt("America/Panama");
    return Math.round((localCliente-localNuestro)/3600000);
  }catch(e){ return null; }
}

/* ---------------------------- NICHO OBJETIVO Y PRESUPUESTO ---------------------------- */
const NICHOS = ["Restaurante","Hotel","Clínica","Otro"];
const PRESUPUESTO_MIN = 1200;
const PRESUPUESTO_MAX = 1500;
function encajaPresupuesto(monto){
  const n = Number(monto)||0;
  return n>=PRESUPUESTO_MIN && n<=PRESUPUESTO_MAX;
}
/* Calcula puntos de encaje real (nicho objetivo + presupuesto + falencia identificada + tamaño ideal 1-30 colaboradores) */
function calcularEncaje(lead){
  let pts = 0; const razones = [];
  if(NICHOS.includes(lead.nicho) && lead.nicho!=="Otro"){ pts+=25; razones.push(`Nicho objetivo (${lead.nicho})`); }
  if(encajaPresupuesto(lead.presupuesto)){ pts+=25; razones.push("Presupuesto dentro de rango ($1,200–$1,500)"); }
  if(lead.falencia && lead.falencia.trim().length>10){ pts+=25; razones.push("Falencia de servicio identificada"); }
  const col = Number(lead.colaboradores)||0;
  if(col>=1 && col<=30){ pts+=15; razones.push("Tamaño ideal (1–30 colaboradores)"); }
  if(lead.pais){ pts+=10; razones.push("Ubicación geográfica registrada"); }
  return {pts, razones};
}

/* ---------------------------- CAPTACIÓN GOOGLE BUSINESS / RESEÑAS ---------------------------- */
/* Estructura lista para conectar Google Places API más adelante; por ahora se captura manualmente. */
const FUENTES_GOOGLE = ["Google Business (sin sitio web)","Reseñas de Google","Google Maps — búsqueda manual"];

/* ---------------------------- ESTADO DEL AGENTE IA (producto entregado al cliente) ---------------------------- */
const ESTADOS_AGENTE_IA = ["No implementado","Setup en curso","En prueba con el cliente","Activo 24/7","Pausado"];
function estadoAgenteBadge(estado){
  const map = {"No implementado":"perdido","Setup en curso":"alta","En prueba con el cliente":"media","Activo 24/7":"convertido","Pausado":"critica"};
  return map[estado] || "nuevo";
}

/* ---------------------------- DESCARTE DE PROSPECTOS ---------------------------- */
const MOTIVOS_DESCARTE = [
  "No es relevante para nuestro servicio",
  "Ya no está en esa posición / cambió de empresa",
  "Presupuesto insuficiente",
  "No respondió tras varios intentos",
  "Ya tiene un servicio similar contratado",
  "Otro",
];
function seedData(){
  /* Sin datos de ejemplo: esta herramienta se usa en producción para contactar y
     registrar clientes reales desde el día uno, así que arranca completamente vacía. */
  const empresas = [];
  const contactos = [];
  const leads = [];
  const clientes = [];
  const oportunidades = [];
  const actividades = [];
  const vendedores = [];
  const scoringReglas = [
    {id:uid(), evento:"Formulario enviado", puntos:10},
    {id:uid(), evento:"Teléfono confirmado", puntos:5},
    {id:uid(), evento:"Email abierto", puntos:3},
    {id:uid(), evento:"Email clickeado", puntos:5},
    {id:uid(), evento:"Respuesta por WhatsApp", puntos:10},
    {id:uid(), evento:"Solicitud de cotización", puntos:20},
    {id:uid(), evento:"Reunión agendada", puntos:25},
    {id:uid(), evento:"Presupuesto informado", puntos:15},
    {id:uid(), evento:"Visita página de precios", puntos:10},
  ];
  const scoringRangos = [
    {etiqueta:"Frío", min:0, max:20, color:"info"},
    {etiqueta:"Tibio", min:21, max:40, color:"amber"},
    {etiqueta:"Caliente", min:41, max:70, color:"naranja"},
    {etiqueta:"Prioridad", min:71, max:100, color:"red"},
  ];
  return {empresas, contactos, leads, clientes, oportunidades, actividades, vendedores, scoringReglas, scoringRangos, oportunidadesHistorial:[]};
}

let DB = load();
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ /* localStorage no disponible (ej. file://) */ }
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      return migrateDB(parsed);
    }catch(e){}
  }
  const s = seedData();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){ /* continuar solo en memoria */ }
  return s;
}
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){ /* continuar solo en memoria */ } }

/* ---------------------------- MIGRACIÓN DE DATOS GUARDADOS ---------------------------- */
/* Cada mejora agrega campos nuevos (país, nicho, falencia, notas de seguimiento, etc.).
   Sin esto, los prospectos/clientes guardados ANTES de esa mejora se quedan con la
   estructura vieja para siempre — por eso el mapa se veía vacío y el dashboard parecía
   "no actualizarse": no era un problema de tiempo real, era un dato viejo sin migrar. */
function migrateDB(db){
  db.leads = (db.leads||[]).map(l=>({
    pais: "", colaboradores: 0, nicho: "Otro", falencia: "",
    puntosEncaje: 0, estado: "nuevo", motivoDescarte: "",
    ...l,
  }));
  db.clientes = (db.clientes||[]).map(c=>({
    notasSeguimiento: [], riesgo: "bajo", segmento: "Nuevo",
    valorTotal: 0, ticketPromedio: 0, compras: 0,
    ...c,
  }));
  db.oportunidades = (db.oportunidades||[]).map(o=>({
    estadoAgenteIA: "No implementado", probabilidad: 0,
    diasEtapaDesde: o.diasEtapaDesde || todayISO(),
    ...o,
  }));
  db.actividades = (db.actividades||[]).map(a=>({
    estado: "pendiente",
    ...a,
    estado: a.estado==="vencida" ? "pendiente" : (a.estado||"pendiente"), // "vencida" ahora se calcula en vivo, no se guarda
  }));
  db.empresas = (db.empresas||[]).map(e=>({ pais:"Panamá", ciudad:"", industria:"", ...e }));
  db.contactos = db.contactos || [];
  db.oportunidadesHistorial = db.oportunidadesHistorial || [];
  db.scoringReglas = db.scoringReglas || seedData().scoringReglas;
  db.scoringRangos = db.scoringRangos || seedData().scoringRangos;
  // El equipo de vendedores antes venía fijo en el código (Julieta Ríos, Marco Ábrego, Diana Cedeño).
  // Si el usuario ya tenía datos guardados con esos IDs (v1/v2/v3), se preservan sus nombres para
  // que los registros existentes no se queden sin responsable asignado.
  if(!db.vendedores){
    const idsEnUso = new Set();
    [...(db.leads||[]), ...(db.clientes||[]), ...(db.oportunidades||[]), ...(db.actividades||[])].forEach(r=>{ if(r.vendedorId) idsEnUso.add(r.vendedorId); });
    const nombresLegado = {v1:"Julieta Ríos", v2:"Marco Ábrego", v3:"Diana Cedeño"};
    db.vendedores = [...idsEnUso].filter(id=>nombresLegado[id]).map(id=>({id, nombre:nombresLegado[id]}));
  }
  return db;
}

/* ---------------------------- RULES (centralizadas) ---------------------------- */
function scoreLabel(puntuacion){
  const r = DB.scoringRangos.find(r=> puntuacion>=r.min && puntuacion<=r.max) || DB.scoringRangos[0];
  return r;
}
function scoreClass(etiqueta){
  return {"Frío":"score-frio","Tibio":"score-tibio","Caliente":"score-caliente","Prioridad":"score-prioridad"}[etiqueta] || "score-frio";
}
function vendedorNombre(id){ const v=DB.vendedores.find(x=>x.id===id); return v? v.nombre : "Sin asignar"; }

/* Convierte un prospecto en cliente. Función central reutilizada desde la tabla de
   Prospectos y desde el popup del Mapa global (los popups de Leaflet viven fuera del
   ciclo normal de eventos delegados, por eso también se expone en window). */
function convertirLeadACliente(leadId){
  const l = DB.leads.find(x=>x.id===leadId);
  if(!l) return;
  l.estado = "convertido";
  DB.clientes.push({
    id:uid(), nombre: l.empresaNombre || `${l.nombre} ${l.apellido}`, empresaId:null, contactoId:null,
    segmento:"Nuevo", vendedorId:l.vendedorId, riesgo:"bajo",
    ultimaCompra: todayISO(), valorTotal:0, ticketPromedio:0, compras:0, fechaConversion: todayISO(),
    notasSeguimiento: [{fecha: todayISO(), texto: `Convertido desde prospecto (${l.pais? paisInfo(l.pais)?.flag+' '+l.pais : 'sin país'})`, vendedorId: l.vendedorId}],
  });
  save();
  toast(`${l.nombre} ${l.apellido} convertido a cliente`);
  renderView();
}
window.convertirDesdeMapa = function(leadId){ convertirLeadACliente(leadId); };
window.editarDesdeMapa = function(leadId){
  const l = DB.leads.find(x=>x.id===leadId);
  if(l) openModal(leadForm(l));
};
function empresaNombre(id){ const e=DB.empresas.find(x=>x.id===id); return e? e.nombre : "—"; }

const ETAPA_LABEL = {nuevo:"Nuevo",contactado:"Contactado",calificado:"Calificado",propuesta:"Propuesta",negociacion:"Negociación",ganado:"Ganado",perdido:"Perdido"};

    {id:"alertas", label:"Alertas y tareas", ready:true},
    {id:"equipo", label:"Equipo", ready:true},
  ]},

  ]},

];

let currentView = "dashboard";

function renderNav(){
  const root = document.getElementById("navroot");
  root.innerHTML = NAV.map(g=>`
    <div class="navgroup">
      <div class="navgroup-title">${g.group}</div>
      ${g.items.map(it=>`
        <a href="#" class="navitem ${it.id===currentView?'active':''}" data-view="${it.id}">
          <span>${it.label}</span>
          ${it.ready ? '' : '<span class="tag">Próximamente</span>'}
        </a>`).join("")}
    </div>`).join("");
  root.querySelectorAll(".navitem").forEach(a=>{
    a.addEventListener("click", e=>{
      e.preventDefault();
      goTo(a.dataset.view);
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("overlay").classList.remove("active");
    });
  });
}

function goTo(view){
  currentView = view;
  renderNav();
  renderView();
}

/* ---------------------------- TOAST ---------------------------- */
function toast(msg, isErr){
  const wrap = document.getElementById("toastWrap");
  const t = document.createElement("div");
  t.className = "toast" + (isErr?" err":"");
  t.textContent = (isErr?"⚠ ":"✓ ") + msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition=".3s"; setTimeout(()=>t.remove(),300); }, 2600);
}

/* ---------------------------- MODAL ---------------------------- */
function openModal(html){
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modalBg").classList.add("active");
  bindModalEvents();
}
function closeModal(){ document.getElementById("modalBg").classList.remove("active"); }
document.getElementById("modalBg").addEventListener("click", e=>{ if(e.target.id==="modalBg") closeModal(); });

/* ============================================================================
   VIEWS
============================================================================ */
function renderView(){
  const titles = {};
  NAV.forEach(g=>g.items.forEach(it=>titles[it.id]=it.label));
  document.getElementById("viewTitle").textContent = titles[currentView] || "Módulo";
  const c = document.getElementById("content");

  const activeItem = NAV.flatMap(g=>g.items).find(i=>i.id===currentView);
  if(activeItem && !activeItem.ready){
    c.innerHTML = viewSoon(activeItem.label);
    return;
  }

  const renderers = {
    dashboard: viewDashboard,
    alertas: viewAlertas,
    equipo: viewEquipo,
    leads: viewLeads,
    mapa: viewMapaGlobal,
    scoring: viewScoring,
    clientes: viewClientes,
    empresas: viewEmpresas,
    riesgo: viewRiesgo,
    pipeline: viewPipeline,
    oportunidades: viewOportunidades,
  };
  c.innerHTML = (renderers[currentView] || viewDashboard)();
  bindViewEvents();
  if(currentView==="mapa") initMapaGlobal();
}

function viewSoon(label){
  return `<div class="card"><div class="empty">
    <div class="big">🛠️</div>
    <h3 style="margin:6px 0 4px;">${label}</h3>
    <p style="max-width:420px;margin:0 auto;">Función preparada — integración pendiente. Este módulo aparecerá activo cuando se conecte su servicio real (ver <span class="mono">docs/arquitectura.md</span>).</p>
  </div></div>`;
}

/* --------------------------- DASHBOARD --------------------------- */
function viewDashboard(){

  const nuevos = DB.leads.filter(l=> daysAgo(l.fechaIngreso)<=1).length;
  const calientes = DB.leads.filter(l=>{
    const lab = scoreLabel(l.puntuacion).etiqueta;
    return (lab==="Caliente"||lab==="Prioridad");
  });
  const calientesSinContactar = calientes.filter(l=>l.estado==="nuevo").length;

  const opsAbiertas = DB.oportunidades.filter(o=>o.etapa!=="ganado"&&o.etapa!=="perdido");
  const valorPipeline = opsAbiertas.reduce((a,o)=>a+o.valor,0);
  const estancadas = opsAbiertas.filter(o=> daysAgo(o.diasEtapaDesde) > 5);
  const valorEstancado = estancadas.reduce((a,o)=>a+o.valor,0);

  const ganadas = DB.oportunidades.filter(o=>o.etapa==="ganado");
  const perdidas = DB.oportunidades.filter(o=>o.etapa==="perdido");
  const totalCerradas = ganadas.length+perdidas.length;
  const conversion = totalCerradas ? Math.round((ganadas.length/totalCerradas)*100) : 0;
  const ventasPeriodo = ganadas.reduce((a,o)=>a+o.valor,0);
  const ticketProm = ganadas.length ? Math.round(ventasPeriodo/ganadas.length) : 0;

  const clientesRiesgo = DB.clientes.filter(c=>c.riesgo==="alto").length;

  const metaMensual = 15000;
  const cumplMeta = Math.min(100, Math.round((ventasPeriodo/metaMensual)*100));

  const etapasResumen = ETAPAS.filter(e=>e!=="perdido").map(e=>{
    const ops = DB.oportunidades.filter(o=>o.etapa===e);
    const valor = ops.reduce((a,o)=>a+o.valor,0);
    return {etapa:e, cantidad:ops.length, valor};
  });
  const totalEnFunnel = etapasResumen.reduce((a,e)=>a+e.cantidad,0)||1;

  const tareasPendientes = DB.actividades.filter(a=>a.estado==="pendiente").sort((a,b)=> new Date(a.fecha)-new Date(b.fecha));
  const tareasVencidas = tareasPendientes.filter(tareaVencida);

  return `
  <div class="section-title">Indicadores clave</div>
  <div class="grid cols-4">
    <div class="card kpi clickable" data-goto="leads">
      <div class="label">Prospectos totales</div>
      <div class="value">${DB.leads.length}</div>
      <div class="insight ${calientesSinContactar? 'risk':'good'}">${calientesSinContactar} calientes sin contactar</div>
    </div>
    <div class="card kpi clickable" data-goto="leads">
      <div class="label">Prospectos nuevos (24h)</div>
      <div class="value">${nuevos}</div>
      <div class="insight info">${leads.length} activos en total</div>
    </div>
    <div class="card kpi clickable" data-goto="pipeline">
      <div class="label">Valor del pipeline</div>
      <div class="value">${fmtMoney(valorPipeline)}</div>
      <div class="insight ${valorEstancado? 'warn':'good'}">${fmtMoney(valorEstancado)} sin actividad +5 días</div>
    </div>
    <div class="card kpi clickable" data-goto="oportunidades">
      <div class="label">Oportunidades abiertas</div>
      <div class="value">${opsAbiertas.length}</div>
      <div class="insight ${estancadas.length?'warn':'good'}">${estancadas.length} estancadas</div>
    </div>
    <div class="card kpi clickable" data-goto="oportunidades">
      <div class="label">Ventas del período</div>
      <div class="value">${fmtMoney(ventasPeriodo)}</div>
      <div class="insight good">${ganadas.length} cierres ganados</div>
    </div>
    <div class="card kpi clickable" data-goto="pipeline">
      <div class="label">Conversión lead → venta</div>
      <div class="value">${conversion}%</div>
      <div class="insight info">${perdidas.length} oportunidades perdidas</div>
    </div>
    <div class="card kpi">
      <div class="label">Ticket promedio</div>
      <div class="value">${fmtMoney(ticketProm)}</div>
      <div class="insight info">sobre ${ganadas.length} ventas cerradas</div>
    </div>
    <div class="card kpi clickable" data-goto="riesgo">
      <div class="label">Clientes en riesgo</div>
      <div class="value">${clientesRiesgo}</div>
      <div class="insight ${clientesRiesgo? 'risk':'good'}">${clientesRiesgo? 'Requieren seguimiento' : 'Sin alertas activas'}</div>
    </div>
    <div class="card kpi clickable" data-goto="oportunidades">
      <div class="label">Cumplimiento de meta</div>
      <div class="value">${cumplMeta}%</div>
      <div class="insight ${cumplMeta<60?'warn':'good'}">Meta mensual: ${fmtMoney(metaMensual)}</div>
    </div>
  </div>

  <div class="section-title">Pipeline comercial</div>
  <div class="card card-pad">
    <div style="display:flex;gap:6px;align-items:stretch;overflow-x:auto;">
      ${etapasResumen.map((e,i)=>`
        <div class="clickable" data-goto="pipeline" style="flex:1;min-width:120px;text-align:center;position:relative;">
          <div style="background:${i<2?'var(--info-soft)': i<4?'var(--amber-soft)':'var(--accent-soft)'};border-radius:8px;padding:12px 8px;">
            <div style="font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:4px;">${ETAPA_LABEL[e.etapa]}</div>
            <div style="font-family:'Sora';font-weight:700;font-size:18px;">${e.cantidad}</div>
            <div style="font-size:11px;font-family:'IBM Plex Mono';color:var(--muted);">${fmtMoney(e.valor)}</div>
            <div style="font-size:10.5px;color:var(--muted);">${Math.round(e.cantidad/totalEnFunnel*100)}%</div>
          </div>
        </div>
        ${i<etapasResumen.length-1?'<div style="align-self:center;color:var(--muted);font-size:16px;">›</div>':''}
      `).join("")}
    </div>
  </div>

  <div class="grid cols-2" style="margin-top:20px;align-items:start;">
    <div>
      <div class="section-title">Alertas activas</div>
      <div class="card card-pad">
        ${calientesSinContactar? `<div class="alert-row"><span class="txt"><b>${calientesSinContactar}</b> prospectos calientes sin contactar</span><button class="btn btn-sm" data-goto="leads">Ver</button></div>`:""}
        ${estancadas.length? `<div class="alert-row"><span class="txt"><b>${estancadas.length}</b> oportunidades estancadas · ${fmtMoney(valorEstancado)}</span><button class="btn btn-sm" data-goto="pipeline">Ver</button></div>`:""}
        ${clientesRiesgo? `<div class="alert-row"><span class="txt"><b>${clientesRiesgo}</b> clientes en riesgo alto</span><button class="btn btn-sm" data-goto="riesgo">Ver</button></div>`:""}
        ${tareasVencidas.length? `<div class="alert-row"><span class="txt">⏰ <b>${tareasVencidas.length}</b> tarea(s) vencida(s)</span><button class="btn btn-sm" data-goto="alertas">Ver</button></div>`:""}
        ${cumplMeta<60 && opsAbiertas.length+ganadas.length+perdidas.length>0? `<div class="alert-row"><span class="txt">Meta mensual atrasada — <b>${cumplMeta}%</b> cumplido</span><button class="btn btn-sm" data-goto="oportunidades">Ver</button></div>`:""}
        ${!calientesSinContactar && !estancadas.length && !clientesRiesgo && !tareasVencidas.length && (cumplMeta>=60 || opsAbiertas.length+ganadas.length+perdidas.length===0)? `<div class="empty" style="padding:12px 0;">Sin alertas activas ahora mismo.</div>`:""}
      </div>
    </div>
    <div>
      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
        <span>Tareas pendientes</span>
        <button class="btn btn-sm" id="btnNuevaTareaDash">+ Nueva tarea</button>
      </div>
      <div class="card card-pad">
        ${tareasPendientes.length? tareasPendientes.map(t=>`
          <div class="alert-row clickable" data-tarea="${t.id}"><span class="txt">${tareaVencida(t)?'⏰ ':'• '}${t.titulo}<br><span style="color:var(--muted);font-size:11.5px;">${vendedorNombre(t.vendedorId)} · ${fmtDate(t.fecha)}${tareaVencida(t)?' · <b style="color:var(--red);">vencida</b>':''}</span></span><span style="color:var(--muted);font-size:16px;">›</span></div>

      </div>
    </div>
  </div>
  `;
}

let leadFilters = {estado:"", prioridad:"", q:""};

function viewLeads(){
  const rows = DB.leads.filter(l=>{
    if(!leadFilters.estado && l.estado==="descartado") return false; // ocultos del listado activo por defecto
    if(leadFilters.estado && l.estado!==leadFilters.estado) return false;
    if(leadFilters.prioridad && l.prioridad!==leadFilters.prioridad) return false;
    if(leadFilters.q){
      const q = leadFilters.q.toLowerCase();
      if(!(`${l.nombre} ${l.apellido} ${l.empresaNombre}`.toLowerCase().includes(q))) return false;

  </div>
  <div class="card">
    <div class="table-wrap">
    <table>
      <thead><tr><th>Prospecto</th><th>Empresa</th><th>País</th><th>Nicho</th><th>Vendedor</th><th>Estado</th><th>Prioridad</th><th>Puntaje</th><th>Encaje</th><th></th></tr></thead>

const NICHO_ICONO = {"Restaurante":"🍽️","Hotel":"🏨","Clínica":"🏥","Otro":"🏢"};

function initMapaGlobal(){
  const el = document.getElementById("mapaMundi");
  if(!el || typeof L === "undefined") return;
  const map = L.map("mapaMundi", {worldCopyJump:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 18
  }).addTo(map);

  // Bug clásico de Leaflet: si el contenedor aún no tiene su tamaño final cuando el mapa
  // se inicializa (común al cambiar de vista en una SPA), los tiles se calculan mal y el
  // mapa se ve en blanco o cortado, sobre todo en escritorio. Forzamos un recálculo.
  setTimeout(()=> map.invalidateSize(), 100);
  window.addEventListener("resize", ()=> map.invalidateSize());

  const conPais = DB.leads.filter(l=>l.pais && paisInfo(l.pais) && l.estado!=="descartado");

  if(!conPais.length){
    map.setView([20,0], 2);
    L.control.attribution({prefix:false}).addTo(map);
    return;
  }

  // Agrupar por país solo para el color/tamaño del halo; cada negocio recibe su propio marcador
  const porPais = {};
  conPais.forEach(l=>{ (porPais[l.pais] = porPais[l.pais]||[]).push(l); });

  const bounds = [];
  const markers = [];

  Object.keys(porPais).forEach(paisNombre=>{
    const p = paisInfo(paisNombre);
    const leadsPais = porPais[paisNombre];

    // Distribuir los negocios de un mismo país en pequeño círculo alrededor del punto central
    leadsPais.forEach((l, i)=>{
      const angle = (2*Math.PI/Math.max(leadsPais.length,1)) * i;
      const jitter = leadsPais.length>1 ? 0.6 : 0;
      const lat = p.lat + Math.sin(angle)*jitter;
      const lng = p.lng + Math.cos(angle)*jitter;
      const enc = calcularEncaje(l);
      const color = enc.pts>=70? "#C6432A" : enc.pts>=40? "#B9791A" : "#4C5FD5";
      const icono = NICHO_ICONO[l.nicho] || "🏢";

      const divIcon = L.divIcon({
        className: "",
        html: `<div style="background:${color};width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;">
                 <span style="transform:rotate(45deg);font-size:16px;">${icono}</span>
               </div>`,
        iconSize: [34,34], iconAnchor: [17,34], popupAnchor:[0,-32]
      });
      const marker = L.marker([lat,lng], {icon: divIcon}).addTo(map);
      bounds.push([lat,lng]);
      markers.push(marker);

      marker.bindTooltip(`<b>${l.empresaNombre||l.nombre+' '+l.apellido}</b> · ${l.nicho||'—'}`, {direction:"top", offset:[0,-30]});

      const popupHtml = `
        <div style="font-family:'Inter',sans-serif;min-width:230px;">
          <b>${icono} ${l.empresaNombre||'Sin nombre de empresa'}</b>
          <div style="font-size:11.5px;color:#6B7080;margin:2px 0 8px;">${p.flag} ${paisNombre} · <span class="mono" data-tz="${p.tz}">${horaLocal(paisNombre)}</span></div>
          <div style="border-top:1px solid #E4E6EE;padding-top:6px;">
            <b>${l.nombre} ${l.apellido}</b><br>
            <span style="font-size:11.5px;">${l.nicho||'—'} · ${l.colaboradores||0} colaboradores · ${l.telefono||'sin teléfono'}</span><br>
            <span style="font-size:11.5px;">Presupuesto: ${fmtMoney(l.presupuesto)} ${encajaPresupuesto(l.presupuesto)?'✓ en rango':'⚠ fuera de rango'}</span><br>
            ${l.falencia? `<span style="font-size:11.5px;color:#B9791A;">Falencia: ${l.falencia}</span><br>`:''}

          </div>
        </div>`;
      marker.bindPopup(popupHtml, {maxWidth:280});
    });
  });

  // Encuadrar el mapa automáticamente para mostrar todos los negocios cargados
  if(bounds.length===1){
    map.setView(bounds[0], 5);
  }else{
    map.fitBounds(bounds, {padding:[40,40], maxZoom:6});
  }

  // Abrir automáticamente el primer negocio para que el mapa no se vea "vacío"
  if(markers.length) markers[0].openPopup();

  // Reloj en vivo dentro de los popups abiertos
  setInterval(()=>{
    document.querySelectorAll("[data-tz]").forEach(elx=>{
      try{ elx.textContent = new Intl.DateTimeFormat("es",{hour:"2-digit",minute:"2-digit",second:"2-digit",timeZone:elx.dataset.tz}).format(new Date()); }catch(e){}
    });
  }, 1000);
}

function viewPipeline(){
  const cols = ETAPAS.map(et=>{
    const ops = DB.oportunidades.filter(o=>o.etapa===et);
    const valor = ops.reduce((a,o)=>a+o.valor,0);
    return {etapa:et, ops, valor};
  });
  return `
  <div class="kanban" id="kanbanRoot">
    ${cols.map(col=>`
      <div class="kcol" data-etapa="${col.etapa}">
        <div class="kcol-head"><span class="t">${ETAPA_LABEL[col.etapa]}</span><span class="n">${col.ops.length}</span></div>
        <div class="kcol-sum">${fmtMoney(col.valor)}</div>
        <div class="kcol-body">
          ${col.ops.map(o=>{
            const dias = daysAgo(o.diasEtapaDesde);
            return `
            <div class="kcard" draggable="true" data-op="${o.id}">
              <div class="name">${o.nombre}</div>
              <div class="company">${empresaNombre(o.empresaId)} · ${vendedorNombre(o.vendedorId)}</div>
              <div class="foot">
                <span class="value">${fmtMoney(o.valor)}</span>
                <span class="days ${dias>5?'stale':''}">${dias}d en etapa</span>
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>
    `).join("")}
  </div>`;
}

function bindKanban(){
  const root = document.getElementById("kanbanRoot");
  if(!root) return;
  let dragId = null;
  root.querySelectorAll(".kcard").forEach(card=>{
    card.addEventListener("dragstart", e=>{ dragId = card.dataset.op; card.classList.add("drag"); });
    card.addEventListener("dragend", e=>{ card.classList.remove("drag"); });
  });
  root.querySelectorAll(".kcol").forEach(col=>{
    col.addEventListener("dragover", e=>{ e.preventDefault(); col.classList.add("dragover"); });
    col.addEventListener("dragleave", ()=> col.classList.remove("dragover"));
    col.addEventListener("drop", e=>{
      e.preventDefault();
      col.classList.remove("dragover");
      const nuevaEtapa = col.dataset.etapa;
      const op = DB.oportunidades.find(o=>o.id===dragId);
      if(op && op.etapa !== nuevaEtapa){
        DB.oportunidadesHistorial.push({opId:op.id, de:op.etapa, a:nuevaEtapa, fecha:todayISO()});
        op.etapa = nuevaEtapa;
        op.diasEtapaDesde = todayISO();
        op.probabilidad = nuevaEtapa==="ganado"?100: nuevaEtapa==="perdido"?0: op.probabilidad;
        save();
        toast(`Oportunidad movida a "${ETAPA_LABEL[nuevaEtapa]}"`);
        renderView();
      }
    });
  });
}

/* ============================================================================
   EVENT BINDING — elementos de la vista actual (#content).
   Se ejecuta cada vez que se renderiza una vista completa.
============================================================================ */
function bindViewEvents(){
  document.querySelectorAll("[data-goto]").forEach(el=>{
    el.addEventListener("click", ()=> goTo(el.dataset.goto));
  });

  // Tareas / actividades clicables (Dashboard y Alertas y tareas)
  document.querySelectorAll("[data-tarea]").forEach(row=>{
    row.addEventListener("click", ()=> openModal(tareaForm(row.dataset.tarea)));
  });
  const btnNuevaTareaDash = document.getElementById("btnNuevaTareaDash");
  if(btnNuevaTareaDash) btnNuevaTareaDash.addEventListener("click", ()=> openModal(tareaForm()));
  const btnNuevaTarea = document.getElementById("btnNuevaTarea");
  if(btnNuevaTarea) btnNuevaTarea.addEventListener("click", ()=> openModal(tareaForm()));

  // EQUIPO
  const btnNuevoVendedor = document.getElementById("btnNuevoVendedor");
  if(btnNuevoVendedor) btnNuevoVendedor.addEventListener("click", ()=> openModal(vendedorForm()));
  document.querySelectorAll("[data-editar-vendedor]").forEach(btn=>{
    btn.addEventListener("click", ()=> openModal(vendedorForm(btn.dataset.editarVendedor)));
  });

  // Filas de prospecto clicables en cualquier vista (Prospectos, Mapa global)
  document.querySelectorAll("[data-lead]").forEach(row=>{
    row.addEventListener("click", e=>{
      if(e.target.closest("[data-convert]")) return;
      const l = DB.leads.find(x=>x.id===row.dataset.lead);
      if(l) openModal(leadForm(l));
    });
  });

  // LEADS
  const leadSearch = document.getElementById("leadSearch");
  if(leadSearch){
    leadSearch.addEventListener("input", e=>{ leadFilters.q = e.target.value; viewLeadsUpdate(); });
    document.getElementById("fEstado").addEventListener("change", e=>{ leadFilters.estado=e.target.value; viewLeadsUpdate(); });
    document.getElementById("fPrioridad").addEventListener("change", e=>{ leadFilters.prioridad=e.target.value; viewLeadsUpdate(); });
    document.getElementById("btnNuevoLead").addEventListener("click", ()=> openModal(leadForm()));
    document.getElementById("btnCaptarGoogle").addEventListener("click", ()=> openModal(googleCaptureForm()));
    document.getElementById("btnImportar").addEventListener("click", ()=> openModal(`
      <div class="modal-head"><h3>Importar prospectos</h3><button class="close-x" data-close>✕</button></div>
      <div class="modal-body">
        <p>Flujo previsto: seleccionar archivo → detectar columnas → mapear campos → validar → detectar duplicados → vista previa → confirmar → importar.</p>
        <div class="empty"><div class="big">📄</div>Función preparada — integración de importación CSV/Excel pendiente.</div>
      </div>
      <div class="modal-foot"><button class="btn" data-close>Entendido</button></div>
    `));
    document.querySelectorAll("[data-convert]").forEach(btn=>{
      btn.addEventListener("click", e=>{
        e.stopPropagation();
        convertirLeadACliente(btn.dataset.convert);
      });
    });
  }

  // SCORING
  const saveScoring = document.getElementById("saveScoring");
  if(saveScoring){
    saveScoring.addEventListener("click", ()=>{
      document.querySelectorAll("[data-regla]").forEach(inp=>{
        const r = DB.scoringReglas.find(x=>x.id===inp.dataset.regla);
        if(r) r.puntos = Number(inp.value)||0;
      });
      save(); toast("Reglas de scoring actualizadas");
    });
    const simScore = document.getElementById("simScore");
    const renderSim = ()=>{
      const v = Number(simScore.value)||0;
      const r = scoreLabel(v);
      document.getElementById("simResult").innerHTML = `<span class="score-chip ${scoreClass(r.etiqueta)}">${v} pts → ${r.etiqueta}</span>`;
    };
    simScore.addEventListener("input", renderSim); renderSim();
  }

  // CLIENTES
  document.querySelectorAll("[data-cliente]").forEach(row=>{
    row.addEventListener("click", ()=>{
      const c = DB.clientes.find(x=>x.id===row.dataset.cliente);
      openModal(clientePerfil(c));
    });
  });
  const clienteSearch = document.getElementById("clienteSearch");
  if(clienteSearch) clienteSearch.addEventListener("input", e=>{
    clienteFilterQ = e.target.value;
    document.getElementById("content").innerHTML = viewClientes();
    bindViewEvents();
  });
  const btnNuevoCliente = document.getElementById("btnNuevoCliente");
  if(btnNuevoCliente) btnNuevoCliente.addEventListener("click", ()=> openModal(clienteForm()));

  // EMPRESAS
  document.querySelectorAll("[data-empresa]").forEach(row=>{
    row.addEventListener("click", ()=>{
      const e = DB.empresas.find(x=>x.id===row.dataset.empresa);
      openModal(empresaPerfil(e));
    });
  });
  const btnNuevaEmpresa = document.getElementById("btnNuevaEmpresa");
  if(btnNuevaEmpresa) btnNuevaEmpresa.addEventListener("click", ()=> openModal(empresaForm()));

  // OPORTUNIDADES (tabla)
  const btnNuevaOp = document.getElementById("btnNuevaOp");
  if(btnNuevaOp) btnNuevaOp.addEventListener("click", ()=> openModal(oportunidadForm()));
  document.querySelectorAll("[data-op-row]").forEach(row=>{
    row.addEventListener("click", ()=>{
      const o = DB.oportunidades.find(x=>x.id===row.dataset.opRow);
      if(o) openModal(oportunidadForm(o));
    });
  });

  // PIPELINE (kanban) — abrir tarjeta al hacer click, mover etapa al arrastrar
  bindKanban();
  document.querySelectorAll(".kcard").forEach(card=>{
    card.addEventListener("click", ()=>{
      const o = DB.oportunidades.find(x=>x.id===card.dataset.op);
      if(o) openModal(oportunidadForm(o));
    });
  });

  // Modal close buttons (por si el modal ya estaba abierto al re-renderizar)
  document.querySelectorAll("[data-close]").forEach(b=> b.addEventListener("click", closeModal));
}

/* ============================================================================
   MODAL EVENT BINDING — se ejecuta cada vez que se abre un modal (openModal),
   porque su contenido se inyecta dinámicamente y bindViewEvents() ya se
   ejecutó antes de que ese HTML existiera en el DOM.
============================================================================ */
function bindModalEvents(){
  document.querySelectorAll("#modalBox [data-close]").forEach(b=> b.addEventListener("click", closeModal));

  // Guardar / eliminar integrante del equipo
  const saveVendedorBtn = document.getElementById("saveVendedor");
  if(saveVendedorBtn){
    saveVendedorBtn.addEventListener("click", ()=>{
      const nombre = document.getElementById("ve_nombre").value.trim();
      if(!nombre){ toast("El nombre es obligatorio", true); return; }
      const id = saveVendedorBtn.dataset.id;
      const rol = document.getElementById("ve_rol").value;
      if(id){
        Object.assign(DB.vendedores.find(v=>v.id===id), {nombre, rol});
        toast("Integrante actualizado");
      }else{
        DB.vendedores.push({id: uid(), nombre, rol});
        toast("Integrante agregado al equipo");
      }
      save(); closeModal(); renderView();
    });
  }
  const btnEliminarVendedor = document.getElementById("btnEliminarVendedor");
  if(btnEliminarVendedor){
    btnEliminarVendedor.addEventListener("click", ()=>{
      const id = btnEliminarVendedor.dataset.id;
      const enUso = [...DB.leads, ...DB.clientes, ...DB.oportunidades, ...DB.actividades].some(r=>r.vendedorId===id);
      if(enUso){
        toast("No se puede eliminar: tiene prospectos, clientes o tareas asignadas", true);
        return;
      }
      DB.vendedores = DB.vendedores.filter(v=>v.id!==id);
      save(); toast("Integrante eliminado"); closeModal(); renderView();
    });
  }

  // Guardar tarea (nueva o edición), completar, eliminar
  const saveTareaBtn = document.getElementById("saveTarea");
  if(saveTareaBtn){
    saveTareaBtn.addEventListener("click", ()=>{
      const titulo = document.getElementById("ta_titulo").value.trim();
      const fechaVal = document.getElementById("ta_fecha").value;
      if(!titulo){ toast("Escribe una descripción para la tarea", true); return; }
      if(!fechaVal){ toast("Selecciona fecha y hora", true); return; }
      const id = saveTareaBtn.dataset.id;
      const data = {
        tipo: document.getElementById("ta_tipo").value,
        titulo,
        fecha: new Date(fechaVal).toISOString(),
        estado: document.getElementById("ta_estado").value,
        vendedorId: document.getElementById("ta_vendedor").value,
      };
      if(id){
        Object.assign(DB.actividades.find(a=>a.id===id), data);
        toast("Tarea actualizada");
      }else{
        DB.actividades.unshift({...data, id:uid()});
        toast("Tarea creada");
      }
      save(); closeModal(); renderView();
    });
  }
  const btnCompletarTarea = document.getElementById("btnCompletarTarea");
  if(btnCompletarTarea) btnCompletarTarea.addEventListener("click", ()=>{
    const a = DB.actividades.find(x=>x.id===btnCompletarTarea.dataset.id);
    if(!a) return;
    a.estado = "completada";
    save(); toast("Tarea marcada como completada"); closeModal(); renderView();
  });
  const btnEliminarTarea = document.getElementById("btnEliminarTarea");
  if(btnEliminarTarea) btnEliminarTarea.addEventListener("click", ()=>{
    DB.actividades = DB.actividades.filter(x=>x.id!==btnEliminarTarea.dataset.id);
    save(); toast("Tarea eliminada"); closeModal(); renderView();
  });

  // Guardar cliente (nuevo o edición)
  const saveClienteBtn = document.getElementById("saveCliente");
  if(saveClienteBtn){
    saveClienteBtn.addEventListener("click", ()=>{
      const nombre = document.getElementById("cl_nombre").value.trim();
      if(!nombre){ toast("El nombre es obligatorio", true); return; }
      const id = saveClienteBtn.dataset.id;
      const data = {
        nombre,
        empresaId: document.getElementById("cl_empresa").value || null,
        segmento: document.getElementById("cl_segmento").value,
        vendedorId: document.getElementById("cl_vendedor").value,
        riesgo: document.getElementById("cl_riesgo").value,
        valorTotal: Number(document.getElementById("cl_valor").value)||0,
        ticketPromedio: Number(document.getElementById("cl_ticket").value)||0,
        compras: Number(document.getElementById("cl_compras").value)||0,
      };
      if(id){
        Object.assign(DB.clientes.find(c=>c.id===id), data);
        toast("Cliente actualizado");
      }else{
        DB.clientes.push({...data, id:uid(), ultimaCompra: todayISO(), fechaConversion: todayISO(), notasSeguimiento:[]});
        toast("Cliente creado");
      }
      save(); closeModal(); renderView();
    });
  }

  // Abrir edición de cliente desde su perfil
  const btnEditarCliente = document.getElementById("btnEditarCliente");
  if(btnEditarCliente) btnEditarCliente.addEventListener("click", ()=>{
    const c = DB.clientes.find(x=>x.id===btnEditarCliente.dataset.id);
    if(c) openModal(clienteForm(c));
  });

  // Nota de seguimiento de progreso (dentro del perfil de cliente)
  const btnAgregarNota = document.getElementById("btnAgregarNota");
  if(btnAgregarNota) btnAgregarNota.addEventListener("click", ()=>{
    document.getElementById("notaQuickAdd").style.display = "block";
    btnAgregarNota.style.display = "none";
  });
  const btnCancelarNota = document.getElementById("btnCancelarNota");
  if(btnCancelarNota) btnCancelarNota.addEventListener("click", ()=>{
    document.getElementById("notaQuickAdd").style.display = "none";
    if(btnAgregarNota) btnAgregarNota.style.display = "inline-block";
  });
  const btnGuardarNota = document.getElementById("btnGuardarNota");
  if(btnGuardarNota) btnGuardarNota.addEventListener("click", ()=>{
    const texto = document.getElementById("cl_notatxt").value.trim();
    if(!texto){ toast("Escribe una nota antes de guardar", true); return; }
    const c = DB.clientes.find(x=>x.id===btnGuardarNota.dataset.id);
    if(!c) return;
    if(!c.notasSeguimiento) c.notasSeguimiento = [];
    c.notasSeguimiento.push({fecha: todayISO(), texto, vendedorId: c.vendedorId});
    save();
    toast("Nota de seguimiento guardada");
    openModal(clientePerfil(c));
  });

  // Descartar prospecto (abre modal de motivo)
  const btnDescartar = document.getElementById("btnDescartar");
  if(btnDescartar) btnDescartar.addEventListener("click", ()=> openModal(descarteForm(btnDescartar.dataset.id)));

  const confirmDescarte = document.getElementById("confirmDescarte");
  if(confirmDescarte){
    confirmDescarte.addEventListener("click", ()=>{
      const l = DB.leads.find(x=>x.id===confirmDescarte.dataset.id);
      if(!l) return;
      const motivo = document.getElementById("desc_motivo").value;
      const nota = document.getElementById("desc_nota").value;
      l.estado = "descartado";
      l.motivoDescarte = nota? `${motivo} — ${nota}` : motivo;
      save();
      toast(`${l.nombre} ${l.apellido} descartado`);
      closeModal(); renderView();
    });
  }

  // Reactivar prospecto descartado
  const btnReactivar = document.getElementById("btnReactivar");
  if(btnReactivar){
    btnReactivar.addEventListener("click", ()=>{
      const l = DB.leads.find(x=>x.id===btnReactivar.dataset.id);
      if(!l) return;
      l.estado = "nuevo";
      l.motivoDescarte = "";
      save();
      toast(`${l.nombre} ${l.apellido} reactivado`);
      closeModal(); renderView();
    });
  }

  // Agendar reunión (booking) — abre formulario con hora del cliente
  const btnAgendar = document.getElementById("btnAgendar");
  if(btnAgendar) btnAgendar.addEventListener("click", ()=> openModal(agendarForm(btnAgendar.dataset.id)));

  const confirmAgendar = document.getElementById("confirmAgendar");
  if(confirmAgendar){
    // Calcular en vivo la hora equivalente del cliente según la hora elegida en Panamá
    const calcHoraCliente = ()=>{
      const leadId = confirmAgendar.dataset.lead;
      const l = DB.leads.find(x=>x.id===leadId);
      const p = l? paisInfo(l.pais) : null;
      const fecha = document.getElementById("ag_fecha").value;
      const hora = document.getElementById("ag_hora").value;
      const out = document.getElementById("ag_horacliente");
      if(!p || !fecha || !hora || !out) return;
      try{
        const diff = diferenciaHoras(l.pais);
        const [hh,mm] = hora.split(":").map(Number);
        const base = new Date(`${fecha}T${hora}:00`);
        const clienteDate = new Date(base.getTime() + (diff||0)*3600000);
        out.value = `${clienteDate.toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})} (${p.flag} ${l.pais})`;
      }catch(e){ out.value = "—"; }
    };
    ["ag_fecha","ag_hora"].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener("input", calcHoraCliente);
    });
    calcHoraCliente();

    confirmAgendar.addEventListener("click", ()=>{
      const leadId = confirmAgendar.dataset.lead;
      const l = DB.leads.find(x=>x.id===leadId);
      if(!l) return;
      const fecha = document.getElementById("ag_fecha").value;
      const hora = document.getElementById("ag_hora").value;
      const vendedorId = document.getElementById("ag_vendedor").value;
      const motivo = document.getElementById("ag_motivo").value.trim() || `Reunión con ${l.nombre} ${l.apellido}`;
      if(!fecha || !hora){ toast("Selecciona fecha y hora", true); return; }
      const fechaISO = new Date(`${fecha}T${hora}:00`).toISOString();
      DB.actividades.push({
        id: uid(), tipo: "reunion", titulo: motivo, fecha: fechaISO,
        estado: "pendiente", vendedorId, leadId: l.id,
      });
      l.estado = l.estado==="nuevo" ? "contactado" : l.estado;
      save();
      toast(`Reunión agendada con ${l.nombre} ${l.apellido} para el ${fmtDate(fechaISO)}`);
      closeModal(); renderView();
    });
  }

  // Captación manual desde Google Business / reseñas / sin sitio web
  const saveGoogleBtn = document.getElementById("saveGoogleCapture");
  if(saveGoogleBtn){
    saveGoogleBtn.addEventListener("click", ()=>{
      const empresa = document.getElementById("gc_empresa").value.trim();
      if(!empresa){ toast("El nombre del negocio es obligatorio", true); return; }
      const nuevo = {
        id: uid(),
        nombre: document.getElementById("gc_contacto").value || empresa,
        apellido: "",
        empresaNombre: empresa,
        cargo: "",
        email: "",
        telefono: document.getElementById("gc_telefono").value,
        pais: document.getElementById("gc_pais").value,
        colaboradores: 0,
        nicho: document.getElementById("gc_nicho").value,
        falencia: document.getElementById("gc_falencia").value,
        fuente: document.getElementById("gc_fuente").value,
        vendedorId: (DB.vendedores[0]?.id||""),
        productoInteres: "",
        presupuesto: 0,
        prioridad: "media",
        estado: "nuevo",
        puntuacion: 0,
        fechaIngreso: todayISO(),
        googleRating: Number(document.getElementById("gc_rating").value)||null,
        tieneSitioWeb: document.getElementById("gc_tieneweb").value==="si",
        googleLink: document.getElementById("gc_link").value,
      };
      nuevo.puntosEncaje = calcularEncaje(nuevo).pts;
      DB.leads.unshift(nuevo);
      save();
      toast(`${empresa} capturado desde Google`);
      closeModal(); renderView();
    });
  }

  // Guardar prospecto (nuevo o edición)
  const saveLeadBtn = document.getElementById("saveLead");
  if(saveLeadBtn){
    // Recalcular hora local y encaje en vivo mientras se completa el formulario
    const updateLive = ()=>{
      const paisSel = document.getElementById("f_pais");
      const horaInp = document.getElementById("f_horalocal");
      if(paisSel && horaInp) horaInp.value = horaLocal(paisSel.value) + " (hora actual)";
      const enc = calcularEncaje({
        nicho: document.getElementById("f_nicho")?.value,
        presupuesto: document.getElementById("f_presupuesto")?.value,
        falencia: document.getElementById("f_falencia")?.value,
        colaboradores: document.getElementById("f_colaboradores")?.value,
        pais: paisSel?.value,
      });
      const ptsEl = document.getElementById("f_encaje_pts");
      const razEl = document.getElementById("f_encaje_razones");
      if(ptsEl) ptsEl.textContent = enc.pts;
      if(razEl) razEl.textContent = enc.razones.join(" · ") || "Completa los campos para calcular el encaje.";
    };
    ["f_pais","f_nicho","f_presupuesto","f_falencia","f_colaboradores"].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener("input", updateLive);
    });
    saveLeadBtn.addEventListener("click", ()=>{
      const nombre = document.getElementById("f_nombre").value.trim();
      if(!nombre){ toast("El nombre es obligatorio", true); return; }
      const id = saveLeadBtn.dataset.id;
      const data = {
        nombre, apellido: document.getElementById("f_apellido").value,
        empresaNombre: document.getElementById("f_empresa").value,
        cargo: document.getElementById("f_cargo").value,
        email: document.getElementById("f_email").value,
        telefono: document.getElementById("f_telefono").value,
        pais: document.getElementById("f_pais").value,
        colaboradores: Number(document.getElementById("f_colaboradores").value)||0,
        nicho: document.getElementById("f_nicho").value,
        falencia: document.getElementById("f_falencia").value,
        fuente: document.getElementById("f_fuente").value,
        vendedorId: document.getElementById("f_vendedor").value,
        productoInteres: document.getElementById("f_producto").value,
        presupuesto: Number(document.getElementById("f_presupuesto").value)||0,
        prioridad: document.getElementById("f_prioridad").value,
      };
      const enc = calcularEncaje(data);
      data.puntosEncaje = enc.pts;
      if(id){
        Object.assign(DB.leads.find(l=>l.id===id), data);
        toast("Prospecto actualizado");
      }else{
        DB.leads.unshift({...data, id:uid(), estado:"nuevo", puntuacion:0, fechaIngreso: todayISO()});
        toast("Prospecto creado");
      }
      save(); closeModal(); renderView();
    });
  }

  // Guardar empresa
  const neSave = document.getElementById("ne_save");
  if(neSave){
    neSave.addEventListener("click", ()=>{
      const nombre = document.getElementById("ne_nombre").value.trim();
      if(!nombre){ toast("El nombre es obligatorio", true); return; }
      const id = neSave.dataset.id;
      const data = {
        nombre,
        industria: document.getElementById("ne_industria").value,
        ciudad: document.getElementById("ne_ciudad").value,
        pais: document.getElementById("ne_pais").value,
      };
      if(id){
        Object.assign(DB.empresas.find(e=>e.id===id), data);
        toast("Empresa actualizada");
      }else{
        DB.empresas.push({...data, id:uid()});
        toast("Empresa creada");
      }
      save(); closeModal(); renderView();
    });
  }

  // Editar empresa desde su perfil
  const btnEditarEmpresa = document.getElementById("btnEditarEmpresa");
  if(btnEditarEmpresa) btnEditarEmpresa.addEventListener("click", ()=>{
    const e = DB.empresas.find(x=>x.id===btnEditarEmpresa.dataset.id);
    if(e) openModal(empresaForm(e));
  });

  // Agregar contacto a una empresa (desde su perfil)
  const btnAgregarContacto = document.getElementById("btnAgregarContacto");
  if(btnAgregarContacto) btnAgregarContacto.addEventListener("click", ()=>{
    document.getElementById("contactoQuickAdd").style.display = "block";
    btnAgregarContacto.style.display = "none";
  });
  const btnCancelarContacto = document.getElementById("btnCancelarContacto");
  if(btnCancelarContacto) btnCancelarContacto.addEventListener("click", ()=>{
    document.getElementById("contactoQuickAdd").style.display = "none";
    if(btnAgregarContacto) btnAgregarContacto.style.display = "inline-block";
  });
  const btnGuardarContacto = document.getElementById("btnGuardarContacto");
  if(btnGuardarContacto) btnGuardarContacto.addEventListener("click", ()=>{
    const nombre = document.getElementById("ct_nombre").value.trim();
    if(!nombre){ toast("El nombre del contacto es obligatorio", true); return; }
    const empresaId = btnGuardarContacto.dataset.empresa;
    const nuevo = {
      id: uid(), empresaId,
      nombre, apellido: document.getElementById("ct_apellido").value,
      cargo: document.getElementById("ct_cargo").value,
      email: document.getElementById("ct_email").value,
      telefono: document.getElementById("ct_telefono").value,
      principal: document.getElementById("ct_principal").checked,
    };
    DB.contactos.push(nuevo);
    save();
    toast("Contacto agregado");
    const e = DB.empresas.find(x=>x.id===empresaId);
    openModal(empresaPerfil(e));
  });

  // Guardar oportunidad (nueva o edición)
  const saveOpBtn = document.getElementById("saveOp");
  if(saveOpBtn){
    saveOpBtn.addEventListener("click", ()=>{
      const nombre = document.getElementById("op_nombre").value.trim();
      if(!nombre){ toast("El nombre de la oportunidad es obligatorio", true); return; }
      const id = saveOpBtn.dataset.id;
      const data = {
        nombre,
        empresaId: document.getElementById("op_empresa").value || null,
        vendedorId: document.getElementById("op_vendedor").value,
        valor: Number(document.getElementById("op_valor").value)||0,
        etapa: document.getElementById("op_etapa").value,
        probabilidad: Number(document.getElementById("op_prob").value)||0,
        estadoAgenteIA: document.getElementById("op_estado_ia").value,
      };
      if(id){
        const op = DB.oportunidades.find(o=>o.id===id);
        Object.assign(op, data);
        toast("Oportunidad actualizada");
      }else{
        DB.oportunidades.push({...data, id:uid(), diasEtapaDesde: todayISO()});
        toast("Oportunidad creada");
      }
      save(); closeModal(); renderView();
    });
  }
}

function viewLeadsUpdate(){
  document.getElementById("content").innerHTML = viewLeads();
  bindViewEvents();
}

/* ---------------------------- INIT ---------------------------- */
document.getElementById("menuBtn").addEventListener("click", ()=>{
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("active");
});
document.getElementById("overlay").addEventListener("click", ()=>{
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("active");
});

renderNav();
renderView();

/* Refresco en tiempo real: recalcula el Dashboard y Alertas cada 20s (tareas que vencen,
   cambios hechos en otras vistas) sin interrumpir al usuario si hay un modal abierto o
   está escribiendo en un formulario. */
setInterval(()=>{
  const modalAbierto = document.getElementById("modalBg").classList.contains("active");
  if(modalAbierto) return;
  if(currentView==="dashboard" || currentView==="alertas"){
    renderView();
  }
}, 20000);

</script>
</body>
</html>
